<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 21 & Extra 3 - 合計25問</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=M+PLUS+Rounded+1c:wght@400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #4f46e5; --success: #10b981; --error: #ef4444; --bg: #f5f3ff; --text: #1e293b; }
        body { font-family: 'M PLUS Rounded 1c', sans-serif; background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: var(--text); }
        .container { max-width: 600px; width: 100%; background: white; border-radius: 24px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); position: relative; }
        .progress-bar { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        #progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.3s; }
        .stats { font-size: 14px; color: #64748b; display: flex; justify-content: space-between; margin-bottom: 10px; font-family: 'Fira Code', monospace; }
        .en-text { font-size: 20px; font-weight: 700; margin-bottom: 10px; line-height: 1.6; color: #312e81; }
        .jp-text { font-size: 16px; color: #64748b; margin-bottom: 20px; line-height: 1.5; font-weight: normal; border-top: 1px solid #f1f5f9; padding-top: 10px; }
        .options { display: grid; gap: 12px; }
        .btn { padding: 15px; background: white; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: 0.2s; font-size: 16px; font-weight: bold; text-align: left; }
        .btn:hover:not(:disabled) { background: #f1f5f9; border-color: #94a3b8; transform: translateY(-2px); }
        .btn.correct { background: #dcfce7; border-color: #10b981; color: #10b981; }
        .btn.incorrect { background: #fee2e2; border-color: #ef4444; color: #ef4444; }
        .note { display: none; background: #eff6ff; padding: 20px; border-radius: 12px; color: #1e40af; font-size: 15px; margin-top: 20px; border-left: 5px solid #3b82f6; line-height: 1.6; }
        .controls { display: flex; gap: 10px; margin-top: 20px; }
        .next-btn, .skip-btn { flex: 1; padding: 15px; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .next-btn { background: var(--primary); color: white; display: none; }
        .skip-btn { background: #94a3b8; color: white; }
        #overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 120px; pointer-events: none; opacity: 0; z-index: 1000; }
        #overlay.show { animation: pop 0.6s ease-out; }
        @keyframes pop { 0% { opacity: 0; scale: 0.5; } 50% { opacity: 0.8; scale: 1.2; } 100% { opacity: 0; scale: 1; } }
    </style>
</head>
<body>
    <div id="overlay"></div>
    <div class="container">
        <div class="stats"><span id="q-count"></span><span id="score"></span></div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div id="en" class="en-text"></div>
        <div id="jp" class="jp-text"></div>
        <div id="ops" class="options"></div>
        <div id="note" class="note"></div>
        <div class="controls">
            <button class="skip-btn" id="skipBtn" onclick="skipQuestion()">スキップ</button>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">次の問題へ</button>
        </div>
    </div>
    <script>
        const qList = [
            // Lesson 21 [p.44] (13問)
            { jp: "エミが美術部を辞めた理由を知ってる？", en: "Do you know the {B} Emi quit the art club?", ans: "reason why", ops: ["reason why", "way how", "reason that"], note: "the reason why で「〜という理由」を表します。" },
            { jp: "あなたがこの問題を解いた方法を説明してくれませんか。", en: "Can you explain {B} you solved this problem?", ans: "how", ops: ["how", "the way how", "way"], note: "方法を表す関係副詞 how です。the way と how は同時には使いません。" },
            { jp: "父が働いているレストランは私の家の近くにある。", en: "The {B} my father works is near my house.", ans: "restaurant where", ops: ["restaurant where", "restaurant which", "place when"], note: "場所を表す先行詞 + where です。" },
            { jp: "私は初めてアリスに会った日のことを覚えています。", en: "I remember the {B} I first met Alice.", ans: "day when", ops: ["day when", "day where", "day which"], note: "時を表す先行詞 + when です。" },
            { jp: "昨日は風邪をひいていました。そういうわけでパーティーに行けませんでした。", en: "I had a cold yesterday. {B} I couldn't go to the party.", ans: "That's why", ops: ["That's why", "That's how", "This is where"], note: "That's why ~: 「そういうわけで〜」という意味です。" },
            { jp: "ここは昨日野球の試合が行われた場所です。", en: "{B} the baseball game was held yesterday.", ans: "This is where", ops: ["This is where", "That is when", "It is why"], note: "This is where ~: 「ここは〜する場所です」となります。" },
            { jp: "私は正午に家を出ましたが、その時雨が降っていました。", en: "I left home at noon, {B} it was raining.", ans: "when", ops: ["when", "where", "which"], note: "関係副詞の継続用法（, when）で、「そしてその時〜」と補足します。" },
            { jp: "これは私が予約した部屋ではありません。", en: "This is not the room {B} I booked.", ans: "that", ops: ["that", "where", "what"], note: "book(〜を予約する)の目的語が抜けているので関係代名詞の that/which を使います。" },
            { jp: "このようにして私は英語を学んだ。", en: "{B} I learned English.", ans: "This is how", ops: ["This is how", "That is why", "This is way"], note: "This is how: 「このようにして〜」という方法を表します。" },
            { jp: "私たちは奈良へ行き、そこでハイキングを楽しんだ。", en: "We went to Nara, {B} we enjoyed hiking.", ans: "where", ops: ["where", "which", "when"], note: "関係副詞の継続用法（, where）で、「そしてそこで〜」と補足します。" },
            { jp: "1964年は東京でオリンピックが開催された年です。", en: "1964 is the year {B} the Olympics were held in Tokyo.", ans: "when", ops: ["when", "where", "why"], note: "the year when で「〜という年」です。" },
            { jp: "彼がその会議に来なかった理由を知っていますか。", en: "Do you know the reason {B} he didn't come to the meeting?", ans: "why", ops: ["why", "how", "when"], note: "the reason why: 「〜という理由」です。" },
            { jp: "そこが私が生まれた場所です。", en: "That is {B} I was born.", ans: "where", ops: ["where", "when", "why"], note: "先行詞の the place が省略された形です。" },

            // Extra Lesson 3 [p.45] (12問)
            { jp: "この町に住んでいる人ならだれでも、そのイベントに参加できます。", en: "{B} in this town can join the event.", ans: "Whoever lives", ops: ["Whoever lives", "Whomever lives", "Anyone who lives"], note: "Whoever = Anyone who。「〜する人はだれでも」です。" },
            { jp: "だれが質問しても、丁寧に返事をしましょう。", en: "{B} asks, answer politely.", ans: "Whoever", ops: ["Whoever", "Whatever", "Whichever"], note: "Whoever = No matter who。「だれが〜しても」という譲歩の意味です。" },
            { jp: "シンは何を着ても、かっこよく見える。", en: "{B} Shin wears, he looks cool.", ans: "Whatever", ops: ["Whatever", "No matter what", "What"], note: "Whatever = No matter what。「何を〜しても」です。" },
            { jp: "この町のどこでもあなたの行きたいところへ連れて行きます。", en: "I'll take you {B} you want to go in this town.", ans: "wherever", ops: ["wherever", "whenever", "whichever"], note: "wherever: 「〜するところならどこでも」です。" },
            { jp: "助けが必要な時はいつでも電話してください。", en: "Please call me {B} you need help.", ans: "whenever", ops: ["whenever", "wherever", "however"], note: "whenever: 「〜する時はいつでも」です。" },
            { jp: "どんなに速く走っても、電車には間に合わないでしょう。", en: "{B} fast you run, you won't be in time for the train.", ans: "However", ops: ["However", "Whatever", "No matter"], note: "However + 副詞(fast)で「どんなに〜しても」となります。" },
            { jp: "彼はどれだけ疲れていても、毎朝イヌの散歩をします。", en: "{B} tired he is, he walks his dog every morning.", ans: "However", ops: ["However", "Whatever", "No matter"], note: "However + 形容詞(tired) + S + V の形です。" },
            { jp: "あなたが何をしようとも、私はあなたの味方です。", en: "{B} you do, I'm on your side.", ans: "No matter what", ops: ["No matter what", "Whatever you do", "Whatever"], note: "No matter what: 「何を〜しても」を表す強い譲歩です。" },
            { jp: "妹は僕が言うことを何でも信じる。", en: "My sister believes {B} I say.", ans: "whatever", ops: ["whatever", "whenever", "wherever"], note: "whatever: 「〜することは何でも」という意味です。" },
            { jp: "あなたがどちらのルートを選んでも、1時間ほどかかるでしょう。", en: "{B} route you choose, it will take about an hour.", ans: "Whichever", ops: ["Whichever", "Whatever", "Whoever"], note: "Whichever: 「どちらの〜を…しても」です。" },
            { jp: "私がいつトムを訪れても、彼の部屋は清潔だ。", en: "{B} I visit Tom, his room is clean.", ans: "Whenever", ops: ["Whenever", "However", "Wherever"], note: "Whenever = No matter when。「いつ〜しても」です。" },
            { jp: "好きなものを何でも注文していいよ。今日は僕のおごりだ。", en: "You can order {B} you like.", ans: "whatever", ops: ["whatever", "whichever", "whenever"], note: "whatever: 「何でも好きなものを」という意味で使われます。" }
        ];

        let questions = [...qList];
        let currentIdx = 0; let correctCount = 0; let totalAnswered = 0;
        function display() {
            if (currentIdx >= questions.length) { alert('全25問終了しました！よく頑張りましたね！'); currentIdx = 0; correctCount = 0; totalAnswered = 0; questions = [...qList]; }
            const q = questions[currentIdx];
            document.getElementById('q-count').innerText = `Question: ${currentIdx + 1}/${questions.length}`;
            document.getElementById('score').innerText = `Score: ${totalAnswered ? Math.round((correctCount/totalAnswered)*100) : 0}%`;
            document.getElementById('progress-fill').style.width = `${((currentIdx+1)/questions.length)*100}%`;
            
            document.getElementById('en').innerHTML = q.en.replace('{B}', '<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>');
            document.getElementById('jp').innerText = q.jp;
            
            const opsBox = document.getElementById('ops'); opsBox.innerHTML = '';
            [...q.ops].sort(() => Math.random() - 0.5).forEach(o => {
                const b = document.createElement('button'); b.className = 'btn'; b.innerText = o;
                b.onclick = () => {
                    totalAnswered++; document.querySelectorAll('.btn').forEach(btn => btn.disabled = true);
                    if (o === q.ans) { correctCount++; b.classList.add('correct'); showF('⭕'); }
                    else { b.classList.add('incorrect'); showF('❌'); document.querySelectorAll('.btn').forEach(btn => { if(btn.innerText === q.ans) btn.classList.add('correct'); }); questions.splice(currentIdx + 3, 0, {...q}); }
                    
                    document.getElementById('en').innerHTML = q.en.replace('{B}', `<span style="color:var(--primary); font-weight:bold;">${q.ans}</span>`);
                    document.getElementById('jp').innerText = q.jp;
                    
                    if(q.note) {
                        document.getElementById('note').innerText = q.note;
                        document.getElementById('note').style.display = 'block';
                    }
                    document.getElementById('nextBtn').style.display = 'block'; document.getElementById('skipBtn').style.display = 'none';
                };
                opsBox.appendChild(b);
            });
            document.getElementById('note').style.display = 'none'; document.getElementById('nextBtn').style.display = 'none'; document.getElementById('skipBtn').style.display = 'block';
        }
        function skipQuestion() { questions.splice(currentIdx + 5, 0, {...questions[currentIdx]}); nextQuestion(); }
        function nextQuestion() { currentIdx++; display(); }
        function showF(s) { const el = document.getElementById('overlay'); el.innerText = s; el.className = 'show'; setTimeout(() => el.className = '', 600); }
        display();
    </script>
</body>
</html>
