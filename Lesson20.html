<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 20 - 関係詞(2) 完全版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=M+PLUS+Rounded+1c:wght@400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #4338ca; --success: #10b981; --error: #ef4444; --bg: #f5f3ff; --text: #1e293b; }
        body { font-family: 'M PLUS Rounded 1c', sans-serif; background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: var(--text); }
        .container { max-width: 600px; width: 100%; background: white; border-radius: 24px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); position: relative; }
        .progress-bar { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        #progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.3s; }
        .stats { font-size: 14px; color: #64748b; display: flex; justify-content: space-between; margin-bottom: 10px; font-family: 'Fira Code', monospace; }
        .jp-text { font-size: 19px; font-weight: 700; margin-bottom: 15px; line-height: 1.6; color: #312e81; }
        .en-text { font-size: 18px; background: #f8fafc; padding: 20px; border-radius: 15px; border: 2px dashed #cbd5e1; margin-bottom: 20px; line-height: 1.7; position: relative; }
        .options { display: grid; gap: 12px; }
        .btn { padding: 15px; background: white; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: 0.2s; font-size: 16px; font-weight: bold; text-align: left; }
        .btn:hover:not(:disabled) { background: #f1f5f9; border-color: #94a3b8; transform: translateY(-2px); }
        .btn.correct { background: #dcfce7; border-color: #10b981; color: #10b981; }
        .btn.incorrect { background: #fee2e2; border-color: #ef4444; color: #ef4444; }
        .note { display: none; background: #eff6ff; padding: 20px; border-radius: 12px; color: #1e40af; font-size: 15px; margin-top: 20px; border-left: 5px solid #3b82f6; }
        .controls { display: flex; gap: 10px; margin-top: 20px; }
        .next-btn, .skip-btn { flex: 1; padding: 15px; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
        .next-btn { background: var(--primary); color: white; display: none; }
        .skip-btn { background: #94a3b8; color: white; }
        .next-btn:hover, .skip-btn:hover { opacity: 0.9; }
        #overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 120px; pointer-events: none; opacity: 0; z-index: 1000; }
        #overlay.show { animation: pop 0.6s ease-out; }
        @keyframes pop { 0% { opacity: 0; scale: 0.5; } 50% { opacity: 0.8; scale: 1.2; } 100% { opacity: 0; scale: 1; } }
    </style>
</head>
<body>
    <div id="overlay"></div>
    <div class="container">
        <div class="stats">
            <span id="q-count">Question: 1/26</span>
            <span id="score">Score: 0%</span>
        </div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div class="jp-text" id="jp"></div>
        <div class="en-text" id="en"></div>
        <div class="options" id="ops"></div>
        <div class="note" id="note"></div>
        <div class="controls">
            <button class="skip-btn" id="skipBtn" onclick="skipQuestion()">スキップ</button>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">次の問題へ</button>
        </div>
    </div>

    <script>
        const originalQuestions = [
            // p.42 1. Order
            { jp: "横浜は私が生まれた町だ。", en: "Yokohama is the city which {B}.", ans: "in I was born", ops: ["in I was born", "I was born in", "in born I was"], note: "which = the city。in which = where と同じです。" },
            { jp: "昨年私たちが泊まったホテルはよかった。", en: "{B} stayed last year was good.", ans: "The hotel at which we", ops: ["The hotel at which we", "At which the hotel we", "The hotel which at we"], note: "stay at the hotel なので at which になります。" },
            { jp: "カナが話をしている男の子を知っていますか。", en: "Do you know {B}?", ans: "the boy to whom Kana is talking", ops: ["the boy to whom Kana is talking", "the boy to Kana is talking", "the boy whom Kana talking to"], note: "talk to someone の to が前に出た形です。" },
            { jp: "これはハルキが世話をしているネコです。", en: "This is the cat {B}.", ans: "which Haruki takes care of", ops: ["which Haruki takes care of", "of which Haruki takes care", "which takes care of Haruki"], note: "take care of ~ の目的語が欠けている目的格の関係代名詞です。" },
            // p.42 2. Fill
            { jp: "君が見つけたことはすばらしいよ。", en: "{B} you found is great.", ans: "What", ops: ["What", "That", "Which"], note: "「〜すること」という意味の先行詞を含む関係代名詞 what です。" },
            { jp: "その事件について私が覚えていることをあなたにお話しします。", en: "I'll tell you {B} I remember about the case.", ans: "what", ops: ["what", "which", "that"], note: "remember の目的語になる「〜のこと」を表す what です。" },
            { jp: "私は昔のエマを知らない。", en: "I don't know {B} Emma used to be.", ans: "what", ops: ["what", "who", "which"], note: "what one used to be で「昔の（その人）」という慣用表現です。" },
            { jp: "マイクはいわゆる歩く辞書だ。", en: "Mike is {B} a walking dictionary.", ans: "what is called", ops: ["what is called", "what is calling", "what they called"], note: "what is called で「いわゆる」という意味です。" },
            // p.42 3. Japanese
            { jp: "Aya has an aunt who lives in Canada.", en: "{B}", ans: "アヤにはカナダに住んでいるおばがいます。", ops: ["アヤにはカナダに住んでいるおばがいます。", "アヤのカナダに住んでいるおばは有名です。", "アヤはおばと一緒にカナダに住んでいます。"], note: "主格の who。後ろから aunt を修飾します。" },
            { jp: "My grandfather, who is seventy years old, plays tennis every week.", en: "{B}", ans: "私の祖父は、70歳ですが、毎週テニスをします。", ops: ["私の祖父は、70歳ですが、毎週テニスをします。", "70歳の私の祖父はテニスが上手です。", "私の祖父は70歳まで毎週テニスをしていました。"], note: "カンマ付きの継続用法。補足説明を加えます。" },
            { jp: "My uncle gave me this bag, which was made in Italy.", en: "{B}", ans: "叔父が私にこのバッグをくれましたが、それはイタリア製でした。", ops: ["叔父が私にこのバッグをくれましたが、それはイタリア製でした。", "叔父はイタリア製のバッグを私にくれました。", "イタリア製のバッグは叔父からのプレゼントです。"], note: "which が this bag を指し、補足説明しています。" },
            { jp: "I tried to open the door, which was impossible.", en: "{B}", ans: "私はドアを開けようとしたが、それは不可能だった。", ops: ["私はドアを開けようとしたが、それは不可能だった。", "開かないドアを開けるのは不可能だった。", "ドアを開けることができたのは奇跡だった。"], note: "which が「ドアを開けようとしたこと」全体を指しています。" },
            { jp: "I forgot her birthday, which disappointed her.", en: "{B}", ans: "私は彼女の誕生日を忘れてしまい、そのことが彼女をがっかりさせた。", ops: ["私は彼女の誕生日を忘れてしまい、そのことが彼女をがっかりさせた。", "彼女の誕生日を忘れたので、彼女は怒った。", "誕生日を忘れたことは彼女には秘密だった。"], note: "which が「誕生日を忘れたこと」全体を指します。" },
            // p.43 4. Similar
            { jp: "Annie is a friend who I often go shopping with.", en: "Annie is a friend {B} I often go shopping.", ans: "with whom", ops: ["with whom", "who", "with which"], note: "文末の with が関係代名詞の前に移動すると with whom になります。" },
            { jp: "Alex lent me this novel, but I had already read it.", en: "Alex lent me this novel, {B} I had already read.", ans: "which", ops: ["which", "what", "that"], note: "but ~ it をカンマ + which で書き換える継続用法です。" },
            { jp: "His words made me sad.", en: "{B} he said made me sad.", ans: "What", ops: ["What", "That", "Which"], note: "His words（彼の言葉）を「彼が言ったこと（What he said）」に書き換え。" },
            // p.43 5. Japanese
            { jp: "We lost our way, and what was worse, it started to rain.", en: "{B}", ans: "道に迷い、さらに悪いことには、雨が降り出した。", ops: ["道に迷い、さらに悪いことには、雨が降り出した。", "雨が降り出したので、道に迷ってしまった。", "道に迷ったが、幸い雨は降らなかった。"], note: "what was worse で「さらに悪いことには」という慣用表現です。" },
            { jp: "Is there anyone you look up to?", en: "{B}", ans: "あなたが尊敬する人はいますか。", ops: ["あなたが尊敬する人はいますか。", "あなたはだれかを尊敬していますか。", "そこにあなたの尊敬する人はいますか。"], note: "look up to ~ で「〜を尊敬する」。anyone の後の目的格が省略されています。" },
            // p.43 6. Order
            { jp: "これが私の兄が通っている大学です。", en: "This is {B}.", ans: "the university to which my brother goes", ops: ["the university to which my brother goes", "the university which my brother goes to", "to which my brother goes the university"], note: "go to the university の to が前に出た形です。" },
            { jp: "私はそこで見たことが信じられなかった。", en: "I couldn't {B} there.", ans: "believe what I saw", ops: ["believe what I saw", "believe that I saw", "what I saw believe"], note: "believe の目的語として「私が見たこと（what I saw）」を置きます。" },
            { jp: "レンはまた学校に遅刻し、そのことが伊藤先生を怒らせた。", en: "Ren was late for school again, {B}.", ans: "which made Mr. Ito angry", ops: ["which made Mr. Ito angry", "what made Mr. Ito angry", "it made Mr. Ito angry"], note: "前文の内容を which で受ける継続用法です。" },
            // p.43 7. English
            { jp: "昨日あなたがその店で買ったものを私に見せてください。", en: "Please show me {B} at the store yesterday.", ans: "what you bought", ops: ["what you bought", "that you bought", "which you bought"], note: "「あなたが買ったもの」＝ what you bought です。" },
            { jp: "これはその作家が住んでいた家だ。", en: "This is the house {B}.", ans: "in which the writer lived", ops: ["in which the writer lived", "which the writer lived", "what the writer lived in"], note: "live in the house なので in which になります。" },
            { jp: "私はネコを1匹飼っていて、それはとてもかわいい。", en: "I have a cat, {B}.", ans: "which is very cute", ops: ["which is very cute", "that is very cute", "what is very cute"], note: "カンマ付きの継続用法。猫についての補足説明です。" },
            { jp: "ケンタは3年前の彼ではない。", en: "Kenta is not {B} three years ago.", ans: "what he was", ops: ["what he was", "who he was", "what he is"], note: "what he was で「過去の彼」を表します。" },
            { jp: "Girl: Is this the bike key {B}?", en: "(あなたが探していた)", ans: "which you were looking for", ops: ["which you were looking for", "what you were looking for", "which were you looking for"], note: "look for ~ の目的語が欠けている形です。" }
        ];

        let questions = [...originalQuestions];
        let currentIdx = 0;
        let correctCount = 0;
        let totalAnswered = 0;

        function save() {
            localStorage.setItem('L20_progress', JSON.stringify({
                idx: currentIdx,
                correct: correctCount,
                total: totalAnswered
            }));
        }

        function load() {
            const data = localStorage.getItem('L20_progress');
            if (data) {
                const p = JSON.parse(data);
                if (confirm('前回の続きから再開しますか？')) {
                    currentIdx = p.idx;
                    correctCount = p.correct;
                    totalAnswered = p.total;
                } else { localStorage.removeItem('L20_progress'); }
            }
        }

        function display() {
            if (currentIdx >= questions.length) {
                alert(`全問終了！正解率: ${Math.round((correctCount/totalAnswered)*100)}%`);
                currentIdx = 0; correctCount = 0; totalAnswered = 0;
                questions = [...originalQuestions];
                localStorage.removeItem('L20_progress');
            }
            
            const q = questions[currentIdx];
            document.getElementById('q-count').innerText = `Question: ${currentIdx + 1}/${questions.length}`;
            document.getElementById('score').innerText = `Score: ${totalAnswered ? Math.round((correctCount/totalAnswered)*100) : 0}%`;
            document.getElementById('progress-fill').style.width = `${((currentIdx+1)/questions.length)*100}%`;
            
            document.getElementById('jp').innerText = q.jp;
            document.getElementById('en').innerHTML = q.en.replace('{B}', '<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>');
            
            const opsBox = document.getElementById('ops');
            opsBox.innerHTML = '';
            [...q.ops].sort(() => Math.random() - 0.5).forEach(o => {
                const b = document.createElement('button');
                b.className = 'btn';
                b.innerText = o;
                b.onclick = () => check(o, b);
                opsBox.appendChild(b);
            });

            document.getElementById('note').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'block';
        }

        function check(sel, btn) {
            const q = questions[currentIdx];
            const isCorrect = sel === q.ans;
            totalAnswered++;
            
            document.querySelectorAll('.btn').forEach(b => b.disabled = true);
            
            if (isCorrect) {
                correctCount++;
                btn.classList.add('correct');
                showF('⭕');
            } else {
                btn.classList.add('incorrect');
                showF('❌');
                document.querySelectorAll('.btn').forEach(b => {
                    if(b.innerText === q.ans) b.classList.add('correct');
                });
                // 間違えた問題を後で再出題
                const retry = {...q};
                questions.splice(currentIdx + Math.floor(Math.random()*3)+2, 0, retry);
            }

            document.getElementById('en').innerHTML = q.en.replace('{B}', `<span style="color:var(--success); font-weight:bold;">${q.ans}</span>`);
            document.getElementById('note').innerText = q.note;
            document.getElementById('note').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';
            document.getElementById('skipBtn').style.display = 'none';
            save();
        }

        function skipQuestion() {
            const q = questions[currentIdx];
            questions.splice(currentIdx + 5, 0, {...q}); // 5問先に送る
            nextQuestion();
        }

        function nextQuestion() {
            currentIdx++;
            save();
            display();
        }

        function showF(s) {
            const el = document.getElementById('overlay');
            el.innerText = s;
            el.className = 'show';
            setTimeout(() => el.className = '', 600);
        }

        load();
        display();
    </script>
</body>
</html>
