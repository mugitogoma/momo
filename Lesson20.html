<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 20 - 関係詞(2)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=M+PLUS+Rounded+1c:wght@400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #4338ca; --success: #10b981; --error: #ef4444; --bg: #f5f3ff; --text: #1e293b; }
        body { font-family: 'M PLUS Rounded 1c', sans-serif; background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: var(--text); }
        .container { max-width: 600px; width: 100%; background: white; border-radius: 24px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); position: relative; }
        .progress-bar { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        #progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.3s; }
        .stats { font-size: 14px; color: #64748b; display: flex; justify-content: space-between; margin-bottom: 10px; font-family: 'Fira Code', monospace; }
        .en-text { font-size: 20px; font-weight: 700; margin-bottom: 10px; line-height: 1.6; color: #312e81; }
        .jp-text { font-size: 16px; color: #64748b; margin-bottom: 20px; line-height: 1.5; font-weight: normal; border-top: 1px solid #f1f5f9; padding-top: 10px; }
        .options { display: grid; gap: 12px; }
        .btn { padding: 15px; background: white; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: 0.2s; font-size: 16px; font-weight: bold; text-align: left; }
        .btn:hover:not(:disabled) { background: #f1f5f9; border-color: #94a3b8; transform: translateY(-2px); }
        .btn.correct { background: #dcfce7; border-color: #10b981; color: #10b981; }
        .btn.incorrect { background: #fee2e2; border-color: #ef4444; color: #ef4444; }
        .note { display: none; background: #eff6ff; padding: 20px; border-radius: 12px; color: #1e40af; font-size: 15px; margin-top: 20px; border-left: 5px solid #3b82f6; line-height: 1.6; }
        .controls { display: flex; gap: 10px; margin-top: 20px; }
        .next-btn, .skip-btn { flex: 1; padding: 15px; border: none; border-radius: 12px; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .next-btn { background: var(--primary); color: white; display: none; }
        .skip-btn { background: #e2e8f0; color: #64748b; }
        #overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 100px; pointer-events: none; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100; text-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #overlay.show { transform: translate(-50%, -50%) scale(1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div class="stats"><span id="q-count"></span><span id="score">正解: 0</span></div>
        <div class="en-text" id="en"></div>
        <div class="jp-text" id="jp"></div>
        <div id="ops" class="options"></div>
        <div id="note" class="note"></div>
        <div class="controls">
            <button id="skipBtn" class="skip-btn" onclick="skipQuestion()">パス</button>
            <button id="nextBtn" class="next-btn" onclick="nextQuestion()">次へ進む</button>
        </div>
    </div>
    <div id="overlay"></div>

    <script>
        // 元のファイルを完全に再現した26問のリスト
        const qList = [
            {en:"The town {B} I grew up is famous for its hot springs.", jp:"私が育った町は温泉で有名です。", ans:"where", ops:["where","which","that","who"], note:"in which と書き換え可能です。"},
            {en:"July is the month {B} the festival is held.", jp:"7月はその祭りが開催される月です。", ans:"when", ops:["when","which","where","why"], note:"at which/in which と書き換え可能です。"},
            {en:"This is the reason {B} I was late.", jp:"これが、私が遅れた理由です。", ans:"why", ops:["why","which","when","how"], note:"for which と書き換え可能です。"},
            {en:"That is {B} he solved the problem.", jp:"そのようにして、彼は問題を解決しました。", ans:"how", ops:["how","the way","which","where"], note:"the way か how のどちらか一方を使います。"},
            {en:"Paris is a city {B} I want to visit someday.", jp:"パリはいつか訪れたい街です。", ans:"which", ops:["which","where","when","who"], note:"visitの目的語がないため関係代名詞です。"},
            {en:"I remember the day {B} we first met.", jp:"初めて会った日のことを覚えています。", ans:"when", ops:["when","where","which","that"], note:"on which と書き換え可能です。"},
            {en:"This is the house {B} he lives.", jp:"これが、彼が住んでいる家です。", ans:"where", ops:["where","which","that","who"], note:"in which と書き換え可能です。"},
            {en:"Tell me the reason {B} you are so angry.", jp:"そんなに怒っている理由を教えてください。", ans:"why", ops:["why","when","where","which"], note:"for which と書き換え可能です。"},
            {en:"He didn't like the way {B} she treated him.", jp:"彼は彼女の自分への接し方が気に入りませんでした。", ans:"how", ops:["that","how","which","where"], note:"the way that もしくは the way (のみ) が一般的です。"},
            {en:"Do you know the time {B} the train arrives?", jp:"列車が到着する時間を知っていますか。", ans:"when", ops:["when","where","which","why"], note:"at which と書き換え可能です。"},
            {en:"This is the place {B} the accident happened.", jp:"ここが事故の起きた場所です。", ans:"where", ops:["where","when","which","that"], note:"at which/in which と書き換え可能です。"},
            {en:"I'll never forget the summer {B} I spent in Okinawa.", jp:"沖縄で過ごしたあの夏を忘れません。", ans:"which", ops:["which","when","where","that"], note:"spentの目的語がないため関係代名詞です。"},
            {en:"There are cases {B} this rule doesn't apply.", jp:"このルールが適用されない場合があります。", ans:"where", ops:["where","when","which","why"], note:"抽象的な「場合」も where で表すことがあります。"},
            {en:"1945 was the year {B} the war ended.", jp:"1945年は戦争が終わった年でした。", ans:"when", ops:["when","which","where","that"], note:"in which と書き換え可能です。"},
            {en:"I don't understand the reason {B} she left.", jp:"彼女が去った理由が分かりません。", ans:"why", ops:["why","when","where","how"], note:"for which と書き換え可能です。"},
            {en:"That's {B} I managed to finish it on time.", jp:"そのようにして、なんとか時間通りに終えることができました。", ans:"how", ops:["how","where","when","which"], note:"the way か how のどちらか一方を使います。"},
            {en:"The hotel {B} we stayed was very comfortable.", jp:"私たちが泊まったホテルはとても快適でした。", ans:"where", ops:["where","which","that","when"], note:"at which/in which と書き換え可能です。"},
            {en:"The hotel {B} we stayed at was very comfortable.", jp:"私たちが泊まったホテルはとても快適でした。", ans:"which", ops:["which","where","that","when"], note:"at があるので関係代名詞になります。"},
            {en:"Sunday is the day {B} I go grocery shopping.", jp:"日曜日は食料品の買い出しに行く日です。", ans:"when", ops:["when","where","which","that"], note:"on which と書き換え可能です。"},
            {en:"This is the hospital {B} my sister works.", jp:"ここは私の姉が働いている病院です。", ans:"where", ops:["where","which","that","who"], note:"in which と書き換え可能です。"},
            {en:"The reason {B} he failed remains a mystery.", jp:"彼が失敗した理由は謎のままです。", ans:"why", ops:["why","how","where","when"], note:"for which と書き換え可能です。"},
            {en:"Can you explain {B} you made this cake?", jp:"どうやってこのケーキを作ったか説明してくれますか。", ans:"how", ops:["how","the way","which","where"], note:"the way か how のどちらか一方を使います。"},
            {en:"I'll always remember the moment {B} I won the race.", jp:"レースに勝った瞬間のことはずっと覚えているでしょう。", ans:"when", ops:["when","where","which","that"], note:"at which と書き換え可能です。"},
            {en:"The restaurant {B} they recommended was excellent.", jp:"彼らが勧めてくれたレストランは素晴らしかった。", ans:"which", ops:["which","where","when","that"], note:"recommendedの目的語がないため関係代名詞です。"},
            {en:"Autumn is the season {B} the leaves change color.", jp:"秋は葉が色づく季節です。", ans:"when", ops:["when","where","which","why"], note:"in which と書き換え可能です。"},
            {en:"That is the museum {B} we visited last week.", jp:"あれは私たちが先週訪れた美術館です。", ans:"which", ops:["which","where","when","that"], note:"visitedの目的語がないため関係代名詞です。"}
        ];

        let currentIdx = 0;
        let questions = [...qList].sort(() => Math.random() - 0.5);
        let correct = 0;

        // 音声読み上げ用
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const uttr = new SpeechSynthesisUtterance(text);
                uttr.lang = 'en-US';
                window.speechSynthesis.speak(uttr);
            }
        }

        function display() {
            if (currentIdx >= questions.length) {
                document.querySelector('.container').innerHTML = `
                    <div style="text-align:center;">
                        <h2 style="margin-bottom:20px; color:var(--primary)">全26問 終了！</h2>
                        <p style="font-size:24px; font-weight:bold; margin-bottom:30px;">正解数: ${correct} / ${questions.length}</p>
                        <button onclick="location.reload()" class="next-btn" style="display:block; width:100%">もう一度挑戦する</button>
                    </div>`;
                return;
            }
            const q = questions[currentIdx];
            document.getElementById('q-count').innerText = `Question ${currentIdx + 1}/${questions.length}`;
            document.getElementById('score').innerText = `正解: ${correct}`;
            document.getElementById('progress-fill').style.width = `${(currentIdx / questions.length) * 100}%`;
            document.getElementById('en').innerHTML = q.en.replace('{B}', '<u>　　　</u>');
            document.getElementById('jp').innerText = q.jp;
            
            const opsBox = document.getElementById('ops');
            opsBox.innerHTML = '';
            [...q.ops].sort(() => Math.random() - 0.5).forEach(o => {
                const b = document.createElement('button');
                b.className = 'btn';
                b.innerText = o;
                b.onclick = () => {
                    document.querySelectorAll('.btn').forEach(btn => btn.disabled = true);
                    
                    // 【追加】回答時に即座に読み上げ
                    speak(q.en.replace('{B}', q.ans));

                    if(o === q.ans) {
                        b.classList.add('correct');
                        showF('⭕');
                        correct++;
                    } else {
                        b.classList.add('incorrect');
                        showF('❌');
                        document.querySelectorAll('.btn').forEach(btn => {
                            if(btn.innerText === q.ans) btn.classList.add('correct');
                        });
                        questions.splice(currentIdx + 3, 0, {...q});
                    }
                    
                    document.getElementById('en').innerHTML = q.en.replace('{B}', `<span style="color:var(--success); font-weight:bold;">${q.ans}</span>`);
                    if(q.note) {
                        document.getElementById('note').innerText = q.note;
                        document.getElementById('note').style.display = 'block';
                    }
                    document.getElementById('nextBtn').style.display = 'block'; 
                    document.getElementById('skipBtn').style.display = 'none';
                };
                opsBox.appendChild(b);
            });
            document.getElementById('note').style.display = 'none'; 
            document.getElementById('nextBtn').style.display = 'none'; 
            document.getElementById('skipBtn').style.display = 'block';
        }

        function skipQuestion() { questions.splice(currentIdx + 5, 0, {...questions[currentIdx]}); nextQuestion(); }
        function nextQuestion() { currentIdx++; display(); }
        function showF(s) { const el = document.getElementById('overlay'); el.innerText = s; el.className = 'show'; setTimeout(() => el.className = '', 600); }
        
        display();
    </script>
</body>
</html>
