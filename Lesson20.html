<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 20 - 関係詞(2)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=M+PLUS+Rounded+1c:wght@400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #4338ca; --success: #10b981; --error: #ef4444; --bg: #f5f3ff; --text: #1e293b; }
        body { font-family: 'M PLUS Rounded 1c', sans-serif; background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: var(--text); }
        .container { max-width: 600px; width: 100%; background: white; border-radius: 24px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); position: relative; }
        .progress-bar { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        #progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.3s; }
        .stats { font-size: 14px; color: #64748b; display: flex; justify-content: space-between; margin-bottom: 10px; font-family: 'Fira Code', monospace; }
        .en-text { font-size: 20px; font-weight: 700; margin-bottom: 10px; line-height: 1.6; color: #312e81; }
        .jp-text { font-size: 16px; color: #64748b; margin-bottom: 20px; line-height: 1.5; font-weight: normal; border-top: 1px solid #f1f5f9; padding-top: 10px; }
        .options { display: grid; gap: 12px; }
        .btn { padding: 15px; background: white; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: 0.2s; font-size: 16px; font-weight: bold; text-align: left; }
        .btn:hover:not(:disabled) { background: #f1f5f9; border-color: #94a3b8; transform: translateY(-2px); }
        .btn.correct { background: #dcfce7; border-color: #10b981; color: #10b981; }
        .btn.incorrect { background: #fee2e2; border-color: #ef4444; color: #ef4444; }
        .note { display: none; background: #eff6ff; padding: 20px; border-radius: 12px; color: #1e40af; font-size: 15px; margin-top: 20px; border-left: 5px solid #3b82f6; line-height: 1.6; }
        .controls { display: flex; gap: 10px; margin-top: 20px; }
        .next-btn, .skip-btn { flex: 1; padding: 15px; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .next-btn { background: var(--primary); color: white; display: none; }
        .skip-btn { background: #94a3b8; color: white; }
        #overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 120px; pointer-events: none; opacity: 0; z-index: 1000; }
        #overlay.show { animation: pop 0.6s ease-out; }
        @keyframes pop { 0% { opacity: 0; scale: 0.5; } 50% { opacity: 0.8; scale: 1.2; } 100% { opacity: 0; scale: 1; } }
    </style>
</head>
<body>
    <div id="overlay"></div>
    <div class="container">
        <div class="stats"><span id="q-count"></span><span id="score"></span></div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div id="en" class="en-text"></div>
        <div id="jp" class="jp-text"></div>
        <div id="ops" class="options"></div>
        <div id="note" class="note"></div>
        <div class="controls">
            <button class="skip-btn" id="skipBtn" onclick="skipQuestion()">スキップ</button>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">次の問題へ</button>
        </div>
    </div>
    <script>
        const qList = [
            { jp: "横浜は私が生まれた町だ。", en: "Yokohama is the city which {B}.", ans: "I was born in", ops: ["I was born in", "in I was born", "I born was in"], note: "which = the city。最後に in を残す形です。" },
            { jp: "昨年私たちが泊まったホテルはよかった。", en: "{B} stayed last year was good.", ans: "The hotel at which we", ops: ["The hotel at which we", "At which the hotel we", "The hotel which we at"], note: "stay at the hotel なので at which となります。" },
            { jp: "カナが話をしている男の子を知っていますか。", en: "Do you know {B}?", ans: "the boy to whom Kana is talking", ops: ["the boy to whom Kana is talking", "the boy to Kana is talking", "the boy whom Kana talking to"], note: "talk to someone の to が前に出た形です。" },
            { jp: "これはハルキが世話をしているネコです。", en: "This is the cat {B}.", ans: "which Haruki takes care of", ops: ["which Haruki takes care of", "of which Haruki takes care", "which takes care of Haruki"], note: "take care of の目的語が欠けている形です。" },
            { jp: "君が見つけたことはすばらしいよ。", en: "{B} you {B} is great.", ans: "What / found", ops: ["What / found", "That / find", "Which / found"], note: "what: 「〜なこと・もの」という意味で、先行詞を含みます。" },
            { jp: "その事件について私が覚えていることをあなたにお話しします。", en: "I'll tell you {B} I {B} about the case.", ans: "what / remember", ops: ["what / remember", "what / remembered", "that / remember"], note: "what = the thing(s) which。" },
            { jp: "私は昔のエマを知らない。", en: "I don't know {B} Emma {B} to be.", ans: "what / used", ops: ["what / used", "who / used", "what / uses"], note: "what one used to be で「昔のその人」です。" },
            { jp: "マイクはいわゆる歩く辞書だ。", en: "Mike is {B} {B} a walking dictionary.", ans: "what / is called", ops: ["what / is called", "what / called", "what / calling"], note: "what is called で「いわゆる」です。" },
            { jp: "アヤにはカナダに住んでいるおばがいます。", en: "Aya has an aunt who lives in Canada.", ans: "Aya has an aunt who lives in Canada.", ops: ["Aya has an aunt who lives in Canada.", "Aya lives in Canada with her aunt.", "Aya's aunt is famous in Canada."], note: "関係代名詞の基本用法です。" },
            { jp: "私の祖父は、70歳ですが、毎週テニスをします。", en: "My grandfather, who is seventy years old, plays tennis every week.", ans: "My grandfather, who is seventy years old, plays tennis every week.", ops: ["My grandfather, who is seventy years old, plays tennis every week.", "My grandfather plays tennis since he was seventy.", "Every week my grandfather plays tennis at seventy."], note: "継続用法（, who）: 補足説明を加えます。「、そしてその人は〜」と訳します。" },
            { jp: "叔父が私にこのバッグをくれましたが、それはイタリア製でした。", en: "My uncle gave me this bag, which was made in Italy.", ans: "My uncle gave me this bag, which was made in Italy.", ops: ["My uncle gave me this bag, which was made in Italy.", "My uncle bought an Italian bag for himself.", "This bag was made in Italy by my uncle."], note: "継続用法（, which）: 「、そしてそれは〜」と訳します。" },
            { jp: "私はドアを開けようとしたが、それは不可能だった。", en: "I tried to open the door, which was impossible.", ans: "I tried to open the door, which was impossible.", ops: ["I tried to open the door, which was impossible.", "I opened the door and it was impossible.", "Opening the door was possible for me."], note: "カンマ付きの継続用法。前の文全体を先行詞にしています。" },
            { jp: "私は彼女の誕生日を忘れてしまい、そのことが彼女をがっかりさせた。", en: "I forgot her birthday, which disappointed her.", ans: "I forgot her birthday, which disappointed her.", ops: ["I forgot her birthday, which disappointed her.", "She was disappointed because I remembered her birthday.", "Forgetting her birthday was a secret."], note: "which が「誕生日を忘れたこと」全体を指しています。" },
            { jp: "アニーは私がよく一緒に買い物に行く友達です。", en: "Annie is a friend {B} I often go shopping.", ans: "with whom", ops: ["with whom", "who", "with which"], note: "go shopping with a friend の with が前に来た形。" },
            { jp: "アレックスはこの小説を貸してくれましたが、私はそれをすでに読んでいました。", en: "Alex lent me this novel, {B} I had already read.", ans: "which", ops: ["which", "what", "that"], note: "カンマの後は that は使えません。" },
            { jp: "彼が言ったことは私を悲しくさせた。", en: "{B} he said made me sad.", ans: "What", ops: ["What", "That", "Which"], note: "what: 先行詞を含む「〜なこと」。" },
            { jp: "道に迷い、さらに悪いことには、雨が降り出した。", en: "We lost our way, and {B}, it started to rain.", ans: "what was worse", ops: ["what was worse", "what is worse", "which was worse"], note: "what was worse: さらに悪いことには。" },
            { jp: "あなたが尊敬する人はいますか。", en: "Is there anyone you {B}?", ans: "look up to", ops: ["look up to", "respect to", "look up"] },
            { jp: "これは私の兄が通っている大学です。", en: "This is the university {B}.", ans: "to which my brother goes", ops: ["to which my brother goes", "which my brother goes to", "the university my brother goes to"] },
            { jp: "私はそこで見たことが信じられなかった。", en: "I couldn't believe {B} there.", ans: "what I saw", ops: ["what I saw", "that I saw", "what saw I"] },
            { jp: "レンはまた学校に遅刻し、そのことが伊藤先生を怒らせた。", en: "Ren was late for school again, {B}.", ans: "which made Mr. Ito angry", ops: ["which made Mr. Ito angry", "what made Mr. Ito angry", "it made Mr. Ito angry"] },
            { jp: "昨日あなたがその店で買ったものを私に見せてください。", en: "Please show me {B} at the shop yesterday.", ans: "what you bought", ops: ["what you bought", "that you bought", "which you bought"] },
            { jp: "これはその作家が住んでいた家だ。", en: "This is the house {B}.", ans: "which the writer lived in", ops: ["which the writer lived in", "in which the writer lived", "where the writer lived"] },
            { jp: "私はネコを1匹飼っていて、それはとてもかわいい。", en: "I have a cat, {B}.", ans: "which is very cute", ops: ["which is very cute", "that is very cute", "what is very cute"] },
            { jp: "ケンタは3年前の彼ではない。", en: "Kenta is not {B} three years ago.", ans: "what he was", ops: ["what he was", "who he was", "what he is"] },
            { jp: "Girl: Is this the bike key {B}?", en: "(あなたが探していた)", ans: "which you were looking for", ops: ["which you were looking for", "what you were looking for", "which were you looking for"] }
        ];

        let questions = [...qList];
        let currentIdx = 0; let correctCount = 0; let totalAnswered = 0;

        function display() {
            if (currentIdx >= questions.length) { alert('終了！'); currentIdx = 0; correctCount = 0; totalAnswered = 0; questions = [...qList]; }
            const q = questions[currentIdx];
            document.getElementById('q-count').innerText = `Question: ${currentIdx + 1}/${questions.length}`;
            document.getElementById('score').innerText = `Score: ${totalAnswered ? Math.round((correctCount/totalAnswered)*100) : 0}%`;
            document.getElementById('progress-fill').style.width = `${((currentIdx+1)/questions.length)*100}%`;
            
            document.getElementById('en').innerHTML = q.en.replace('{B}', '<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>');
            document.getElementById('jp').innerText = q.jp;
            
            const opsBox = document.getElementById('ops'); opsBox.innerHTML = '';
            [...q.ops].sort(() => Math.random() - 0.5).forEach(o => {
                const b = document.createElement('button'); b.className = 'btn'; b.innerText = o;
                b.onclick = () => {
                    totalAnswered++; document.querySelectorAll('.btn').forEach(btn => btn.disabled = true);
                    if (o === q.ans) { correctCount++; b.classList.add('correct'); showF('⭕'); }
                    else { b.classList.add('incorrect'); showF('❌'); document.querySelectorAll('.btn').forEach(btn => { if(btn.innerText === q.ans) btn.classList.add('correct'); }); questions.splice(currentIdx + 3, 0, {...q}); }
                    
                    document.getElementById('en').innerHTML = q.en.replace('{B}', `<span style="color:var(--success); font-weight:bold;">${q.ans}</span>`);
                    document.getElementById('jp').innerText = q.jp;
                    
                    if(q.note) {
                        document.getElementById('note').innerText = q.note;
                        document.getElementById('note').style.display = 'block';
                    }
                    document.getElementById('nextBtn').style.display = 'block'; document.getElementById('skipBtn').style.display = 'none';
                };
                opsBox.appendChild(b);
            });
            document.getElementById('note').style.display = 'none'; document.getElementById('nextBtn').style.display = 'none'; document.getElementById('skipBtn').style.display = 'block';
        }
        function skipQuestion() { questions.splice(currentIdx + 5, 0, {...questions[currentIdx]}); nextQuestion(); }
        function nextQuestion() { currentIdx++; display(); }
        function showF(s) { const el = document.getElementById('overlay'); el.innerText = s; el.className = 'show'; setTimeout(() => el.className = '', 600); }
        display();
    </script>
</body>
</html>
